<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Random House Sound</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    width: 100%;
  }
  button {
    width: 100vw;
    height: 100vh;
    display: block;
    border: none;
    background: #1a1a2e;
    color: #ffd700;
    font-size: 32px;
    font-weight: bold;
    font-family: sans-serif;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    transition: background 0.1s ease;
  }
  button:active {
    background: #29294d;
  }
</style>
</head>
<body>

<button id="playBtn">▶ Play</button>

<script>
  const sounds = [
    "audio/gryffindor.mp3",
    "audio/slytherin.mp3",
    "audio/ravenclaw.mp3",
    "audio/hufflepuff.mp3"
  ];

  let currentAudio = null;

  document.getElementById("playBtn").addEventListener("click", () => {
    // Don't play anything if a sound is currently playing
    if (currentAudio && !currentAudio.paused) {
      return;
    }

    const choice = sounds[Math.floor(Math.random() * sounds.length)];

    currentAudio = new Audio(choice);

    currentAudio.play().catch(err => {
      alert("Couldn't play " + choice + ". Make sure the 'audio' folder is next to this HTML file. Error: " + err.message);
    });

    // Allow another sound after this one finishes
    currentAudio.addEventListener("ended", () => {
      currentAudio = null;
    });
  });
</script>

</body>
</html>
